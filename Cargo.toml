[package]
name = "thelongdrive"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "validate-reference"
test = false

[workspace]
members = ["crates/crunch", "crates/crunch-worker", "crates/simulation", "crates/simulation-worker", "crates/terrain", "crates/road-mesh", "crates/grass-mesh", "crates/mesh-worker", "crates/wasm-heap"]

[dependencies]
simulation = { path = "crates/simulation" }
bevy_platform = "=0.19.1"
rapier3d = "=0.36.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
terrain = { path = "crates/terrain" }
road-mesh = { path = "crates/road-mesh" }
grass-mesh = { path = "crates/grass-mesh" }
crunch = { path = "crates/crunch" }
wasm-heap = { path = "crates/wasm-heap" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-lock = "=3.4.2"
bytemuck = "=1.25.2"
js-sys = "=0.3.106"
wgpu = { version = "=29.0.4", default-features = false, features = ["serde"] }
# `reflect_auto_register` fills the type registry that glTF scene spawning (`WorldAssetRoot`) needs.
# Without it the WASM is not smaller.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_window",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_light", "bevy_mesh", "bevy_camera", "bevy_color",
    "keyboard", "mouse", "bevy_gltf", "reflect_auto_register", "webgpu",
] }
# Bevy `info!` goes through tracing. Release builds drop info, debug and trace at compile time (V6).
# The simulation crate sets the same feature on `log`, which wgpu uses.
tracing = { version = "=0.1.44", default-features = false, features = ["release_max_level_warn"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# The frame limit wakes the Bevy event loop through its proxy. Same version as bevy_winit.
winit = { version = "=0.30.13", default-features = false }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras"] }
console_error_panic_hook = "=0.1.7"

# `validate-reference` and native tests run the manifest checks. WASM builds leave them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simulation = { path = "crates/simulation", features = ["validate"] }
# The export crunch check of `validate-reference`.
sha2 = "=0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "bevy_asset", "bevy_mesh", "bevy_camera",
] }
naga = { version = "=29.0.4", features = ["wgsl-in"] }

# Backtraces keep file and line. Full debug info made `target/debug` 7.9 GB (R5-1).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Fast rebuilds for iteration: `scripts/build.ps1 -Fast`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
parry3d = { path = "vendor/parry3d" }
rapier3d = { path = "vendor/rapier3d" }
