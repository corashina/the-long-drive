# Cloudflare Pages project. `node scripts/deploy.mjs` stages the site and uploads it.
name = "thelongdrive"
pages_build_output_dir = ".cache/deploy"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "LARGE_FILES"
bucket_name = "the-long-slop-large"

[[d1_databases]]
binding = "EVENTS"
database_name = "the-long-slop-events"
database_id = "caf9553e-fce3-4a30-a134-560fa4752aed"
migrations_dir = "migrations"
