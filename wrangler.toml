# Cloudflare Pages project. `node scripts/deploy.mjs` stages the site and uploads it.
name = "thelongdrive"
pages_build_output_dir = ".cache/deploy"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "LARGE_FILES"
bucket_name = "thelongdrive-large"

[[d1_databases]]
binding = "EVENTS"
database_name = "thelongdrive-events"
database_id = "afa4e5dc-5d5d-4ee6-ace0-c327f8662833"
migrations_dir = "migrations"
